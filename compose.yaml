name: indoor-air-quality-iot
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-air_quality}
      MYSQL_USER: ${MYSQL_USER:-iot_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/bootstrap.py}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/bootstrap.py}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_demo.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  mosquitto:
    image: eclipse-mosquitto:2
    user: "0:0"
    entrypoint: ["/bin/sh", "/iot/start.sh"]
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Run scripts/bootstrap.py}
      MQTT_ESP32_PASSWORD: ${MQTT_ESP32_PASSWORD:?Run scripts/bootstrap.py}
      MQTT_SIM_PASSWORD: ${MQTT_SIM_PASSWORD:?Run scripts/bootstrap.py}
    volumes:
      - ./deployment/mosquitto:/iot:ro
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:1883:1883"
  api:
    image: indoor-air-quality-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-air_quality}
      MYSQL_USER: ${MYSQL_USER:-iot_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/bootstrap.py}
      MQTT_HOST: mosquitto
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Run scripts/bootstrap.py}
      JWT_SECRET: ${JWT_SECRET:-iot_secret_jwt_key_2026}
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
  worker:
    image: indoor-air-quality-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-air_quality}
      MYSQL_USER: ${MYSQL_USER:-iot_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/bootstrap.py}
      MQTT_HOST: mosquitto
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:?Run scripts/bootstrap.py}
    depends_on:
      mysql:
        condition: service_healthy
      mosquitto:
        condition: service_started
  simulator:
    profiles: ["sim"]
    image: indoor-air-quality-backend:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "simulator.publish"]
    environment:
      MQTT_HOST: mosquitto
      MQTT_SIM_PASSWORD: ${MQTT_SIM_PASSWORD:?Run scripts/bootstrap.py}
      SIM_SCENARIO: ${SIM_SCENARIO:-normal}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-10}
    depends_on:
      - mosquitto
volumes:
  mysql_data:

